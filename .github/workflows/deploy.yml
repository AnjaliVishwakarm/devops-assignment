name: Build, Publish and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/anjalivishwakarm/devops-assignment

jobs:

  # ==================================================
  # BUILD, TEST, SCAN AND PUSH
  # ==================================================

  build-and-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------
      # Checkout
      # -----------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------
      # Node.js
      # -----------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      # -----------------------------------------------
      # Install dependencies
      # -----------------------------------------------

      - name: Install dependencies
        working-directory: application
        run: npm install


      # -----------------------------------------------
      # Dependency vulnerability scan
      # -----------------------------------------------

      - name: Scan dependencies
        working-directory: application
        run: npm audit --audit-level=high


      # -----------------------------------------------
      # Unit tests
      # -----------------------------------------------

      - name: Run unit tests
        working-directory: application
        run: npm test


      # -----------------------------------------------
      # Build Docker image
      # -----------------------------------------------

      - name: Build Docker image
        working-directory: application
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            .


      # -----------------------------------------------
      # Container vulnerability scan
      # -----------------------------------------------

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # -----------------------------------------------
      # Integration test
      # -----------------------------------------------

      - name: Start application container
        run: |
          docker run -d \
            --name ember-test \
            -p 8080:80 \
            $IMAGE_NAME:${{ github.sha }}

          sleep 5


      - name: Run integration test
        run: |
          curl --fail http://localhost:8080

          echo "Integration test passed."


      - name: Stop test container
        if: always()
        run: |
          docker stop ember-test || true
          docker rm ember-test || true


      # -----------------------------------------------
      # Login to GHCR
      # -----------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------
      # Push Docker image
      # -----------------------------------------------

      - name: Push Docker image
        run: |
          docker push \
            $IMAGE_NAME:${{ github.sha }}


  # ==================================================
  # DEPLOY TO STAGING
  # ==================================================

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}

    steps:

      # -----------------------------------------------
      # Configure AWS using GitHub OIDC
      # -----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1


      # -----------------------------------------------
      # Verify staging instance
      # -----------------------------------------------

      - name: Verify staging instance
        run: |
          echo "Staging Instance ID: $STAGING_INSTANCE_ID"

          aws ec2 describe-instances \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --region us-east-1 \
            --query "Reservations[].Instances[].InstanceId" \
            --output text


      # -----------------------------------------------
      # Deploy application to staging
      # -----------------------------------------------

      - name: Deploy application to staging
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "docker stop ember-app || true",
              "docker rm ember-app || true",
              "docker run -d --name ember-app --restart unless-stopped -p 80:80 ${{ env.IMAGE_NAME }}:${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$STAGING_INSTANCE_ID"


      # -----------------------------------------------
      # Verify staging deployment
      # -----------------------------------------------

      - name: Verify staging deployment
        run: |

          echo "Checking staging deployment..."

          STATUS=$(aws ssm send-command \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker ps --filter name=ember-app --format \"{{.Status}}\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$STATUS" \
            --instance-id "$STAGING_INSTANCE_ID"

          echo "Staging deployment verified."


  # ==================================================
  # DEPLOY TO PRODUCTION
  # ==================================================

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest

    # GitHub Environment provides manual approval
    environment:
      name: production

    env:
      PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}

    steps:

      # -----------------------------------------------
      # Configure AWS using GitHub OIDC
      # -----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1


      # -----------------------------------------------
      # Verify production instance
      # -----------------------------------------------

      - name: Verify production instance
        run: |
          echo "Production Instance ID: $PRODUCTION_INSTANCE_ID"

          aws ec2 describe-instances \
            --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --region us-east-1 \
            --query "Reservations[].Instances[].InstanceId" \
            --output text


      # -----------------------------------------------
      # Deploy application to production
      # -----------------------------------------------

      - name: Deploy application to production
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "docker stop ember-app || true",
              "docker rm ember-app || true",
              "docker run -d --name ember-app --restart unless-stopped -p 80:80 ${{ env.IMAGE_NAME }}:${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$PRODUCTION_INSTANCE_ID"


      # -----------------------------------------------
      # Verify production deployment
      # -----------------------------------------------

      - name: Verify production deployment
        run: |

          echo "Production deployment completed successfully."

          aws ssm send-command \
            --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker ps --filter name=ember-app --format \"{{.Status}}\""
            ]' \
            --query "Command.CommandId" \
            --output text

    # ==================================================
  # FAILURE EMAIL NOTIFICATION
  # ==================================================

  notify-failure:
    name: Notify on Failure

    if: ${{ always() && (needs.build-and-push.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure') }}

    needs:
      - build-and-push
      - deploy-staging
      - deploy-production

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send failure email
        env:
          FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.SES_TO_EMAIL }}

        run: |
          aws ses send-email \
            --region us-east-1 \
            --from "$FROM_EMAIL" \
            --destination "ToAddresses=$TO_EMAIL" \
            --subject "CI/CD Pipeline Failed - ${{ github.repository }}" \
            --text "CI/CD pipeline failure detected.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}

          Please check the GitHub Actions run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"